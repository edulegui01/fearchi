version: '3.8'

services:
  # Frontend en modo desarrollo
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile
      # El Dockerfile pasó a tener varias etapas: sin esto se construiría la
      # última, que es nginx con el bundle ya compilado.
      target: dev
    container_name: fe-sco
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:3000
    restart: unless-stopped
    networks:
      - iot-dev-network

networks:
  iot-dev-network:
    driver: bridge