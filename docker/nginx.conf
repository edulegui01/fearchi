server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La terminal vive en /vertical-products y el router es BrowserRouter, o
    # sea rutas reales. Sin este fallback, recargar la pagina en la caja
    # —o abrirla directo en esa URL, que es como arranca el kiosco— devuelve
    # 404 de nginx antes de que React llegue a ver nada.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El index es lo unico que apunta al bundle nuevo despues de un despliegue.
    # Si queda cacheado, la caja sigue mostrando el anterior sin ningun sintoma.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Los assets llevan hash en el nombre: un archivo nunca cambia de contenido,
    # asi que se pueden cachear sin riesgo.
    location /assets/ {
        access_log off;
        # Una sola cabecera: `expires` ya emite su propio Cache-Control y
        # combinarlo con add_header manda las dos, cada una por su lado.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
